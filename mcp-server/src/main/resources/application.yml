spring:
  application:
    name: mmd-mcp-server
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  ai:
    mcp:
      server:
        name: mmd-mcp-server
        version: v1
        protocol: STATELESS
        instructions: MMD 데이터를 조회하는 도구를 제공합니다.
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

server:
  # 인증을 붙이기 전까지 외부에 노출하지 않습니다.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        startup:
          include: readinessState

mmd:
  mcp:
    # 브라우저에서 오는 요청의 허용 출처입니다. 비어 있으면 모두 거부하고, Origin이 없는 AI 클라이언트는 통과합니다.
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  backend:
    url: ${BACKEND_URL:http://localhost:8080}
    timeout: ${BACKEND_TIMEOUT:10s}

logging:
  structured:
    format:
      console: logstash
