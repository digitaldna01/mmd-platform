# 개발·검증용 구성입니다. 쿠버네티스로 옮겨도 이미지와 환경 변수 이름은 그대로 씁니다.
name: mmd

x-java-service: &java-service
  restart: unless-stopped
  stop_grace_period: 35s
  mem_limit: 768m

services:
  backend-1: &backend
    <<: *java-service
    image: mmd-backend:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    environment:
      # 메모리 어댑터는 개발용입니다. 검증·운영에서는 TIBRV 어댑터를 지정합니다.
      MESSAGING_ADAPTER: ${MESSAGING_ADAPTER:-memory}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  backend-2:
    <<: *backend

  mcp-server:
    <<: *java-service
    image: mmd-mcp-server:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: mcp-server/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    environment:
      SERVER_ADDRESS: 0.0.0.0
      BACKEND_URL: http://gateway:8080
    ports:
      # 인증을 붙이기 전까지 이 PC 안에서만 접속합니다.
      - "127.0.0.1:${MCP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  frontend:
    image: mmd-frontend:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 6

  gateway:
    image: ${BASE_REGISTRY:-docker.io}/nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8080"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
