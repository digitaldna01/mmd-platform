log_format json_access escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,'
    '"traceId":"$http_x_trace_id","upstream":"$upstream_addr","durationSec":$request_time}';

# Docker 내장 DNS입니다. 컨테이너가 다시 만들어져 IP가 바뀌어도 따라갑니다.
resolver 127.0.0.11 valid=5s;

# 연결에 실패한 서버는 fail_timeout 동안 제외합니다. 순차 재시작할 때는 인스턴스 사이에
# fail_timeout보다 길게 기다려야 합니다. 앞 서버가 아직 제외된 채로 다음 서버를 내리면
# 살아 있는 서버가 없다고 판단해 502가 납니다.
upstream backend {
    zone backend 64k;
    server backend-1:8080 resolve max_fails=1 fail_timeout=3s;
    server backend-2:8080 resolve max_fails=1 fail_timeout=3s;
    keepalive 16;
}

upstream frontend {
    zone frontend 64k;
    server frontend:8080 resolve;
}

server {
    listen 8080;
    access_log /dev/stdout json_access;

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;

        # 연결 실패만 다른 BE로 넘깁니다. BE의 503, 504까지 재시도하면 MMD 서버가 느릴 때
        # 같은 요청이 두 번 나갑니다. POST 등은 nginx 기본값대로 재전송하지 않습니다.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
