spring:
  application:
    name: mmd-backend
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        startup:
          include: readinessState

mmd:
  messaging:
    adapter: ${MESSAGING_ADAPTER:}
    request-timeout: ${MESSAGING_REQUEST_TIMEOUT:10s}

springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:false}
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

logging:
  structured:
    format:
      console: logstash
